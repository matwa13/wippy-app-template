version: "1.0"
namespace: app.agents

entries:
  - name: wippy
    kind: registry.entry
    meta:
      type: agent.gen1
      title: Ask Wippy
      comment: Wippy AI assistant
      icon: tabler:message-circle
      class:
        - public
        - primary
    prompt: |
      You are Wippy, a helpful AI assistant.
      You can help users navigate the application, manage their personal tasks, and answer general questions.

      Available pages (use NavigateTo):
      - home: Home page
      - users: User management
      - tasks: Personal tasks
      - trips: Trip planning

      If the user asks to see or open a specific page, use NavigateTo.
      Be concise and helpful.
    model: claude-4-5-sonnet
    temperature: 0.5
    max_tokens: 8000
    traits:
      - id: userspace.user.traits:user_aware
      - id: app.agents:wippy_nav_trait
      - id: app.agents:wippy_artifacts_trait
      - id: app.tasks:tasks_trait
      - id: app.trips:trips_trait

  - name: wippy_nav_trait
    kind: registry.entry
    meta:
      type: agent.trait
      title: Wippy Navigation
      tags:
        - navigation
    prompt: |
      You have access to the NavigateTo tool to open pages in the UI.
      Use NavigateTo when the user wants to open or view a specific page.
    tools:
      - app.agents:navigate_to

  - name: wippy_artifacts_trait
    kind: registry.entry
    meta:
      type: agent.trait
      title: Wippy Artifacts
      tags:
        - artifacts
    prompt: |
      You have the CreateArtifact tool to create rich content artifacts displayed inline in the chat.

      Two modes:
      1. **Content mode** — pass `content` (HTML or Markdown) directly.
         Use for: formatted text, code snippets, tables, documentation.
      2. **Component mode** — pass `tag_name` and `props` to render a registered web component.
         Use for: diagrams, interactive widgets, visualizations.
         Only use tag names from the available components list in the session context.

      After calling the tool you will receive instructions with an artifact tag — include that tag in your response.
    tools:
      - app.agents:create_artifact

  - name: trips_trait
    kind: registry.entry
    meta:
      type: agent.trait
      title: Trip Planning
      tags:
        - trips
    prompt: |
      You can plan trips for the user.
      - PlanTrip(destination, start_date, end_date, origin?) — start a trip planning workflow.
      If any required field is missing, ask the user conversationally before calling. Dates must
      be full ISO dates with year (yyyy-mm-dd). When the user mentions a date without a year,
      use the current year — never guess a past year.
      After calling PlanTrip successfully, reply with a short confirmation that includes the
      returned url so the user can click through to the live trip page.
    tools:
      - app.trips:plan_trip

  - name: create_artifact
    kind: function.lua
    meta:
      type: tool
      title: Create Artifact
      input_schema: |
        {
          "type": "object",
          "properties": {
            "title": {
              "type": "string",
              "description": "Title for the artifact"
            },
            "content": {
              "type": "string",
              "description": "The content body. For content mode: HTML or Markdown string. For component mode: optional, usually use props instead."
            },
            "content_type": {
              "type": "string",
              "description": "MIME type for content mode",
              "enum": ["text/html", "text/markdown"],
              "default": "text/markdown"
            },
            "tag_name": {
              "type": "string",
              "description": "Web component tag name for component mode (e.g. 'example-mermaid'). When set, the artifact renders using this component instead of raw content."
            },
            "props": {
              "type": "object",
              "description": "Props object passed to the web component. Only used with tag_name."
            }
          },
          "required": ["title"],
          "additionalProperties": false
        }
      llm_alias: CreateArtifact
      llm_description: |
        Create a rich content artifact rendered inline in the chat.
        Two modes: (1) Content mode — provide title + content (HTML or Markdown).
        (2) Component mode — provide title + tag_name + props to render a registered web component.
        Use component mode when a matching component is available (check session context for available components).
    source: file://create_artifact.lua
    modules:
      - json
    imports: {}
    method: handler
    pool:
      size: 2

  - name: navigate_to
    kind: function.lua
    meta:
      type: tool
      title: Navigate To Page
      input_schema: |
        {
          "type": "object",
          "properties": {
            "page": {
              "type": "string",
              "description": "The page to navigate to",
              "enum": [
                "home",
                "users",
                "tasks",
                "trips"
              ]
            }
          },
          "required": ["page"],
          "additionalProperties": false
        }
      llm_alias: NavigateTo
      llm_description: Open a page in the UI for the user.
    source: file://navigate_to.lua
    modules:
      - ctx
    imports: {}
    method: handler
    pool:
      size: 2

  - name: trip_attractions_researcher
    kind: registry.entry
    meta:
      type: agent.gen1
      title: Trip Attractions Researcher
      comment: Returns up to 12 candidate attractions for a destination
    prompt: |
      You are a travel research agent. Given a destination and trip dates, return up to 12
      notable attractions as stable facts about that place. Do NOT schedule them — another
      agent handles planning. Prefer well-known sights; include a short description, a typical
      visit duration in hours, and any constraints that would affect scheduling (e.g. closed
      on certain days, best at sunset). Your reply MUST match the exit_schema.
    model: claude-4-5-sonnet
    temperature: 0.3
    max_tokens: 4000
    arena:
      max_iterations: 3
      exit_schema:
        type: object
        required: [attractions]
        additionalProperties: false
        properties:
          attractions:
            type: array
            maxItems: 12
            items:
              type: object
              required: [name, description, typical_duration_hours, constraints]
              additionalProperties: false
              properties:
                name: { type: string }
                description: { type: string }
                typical_duration_hours: { type: number }
                constraints:
                  type: array
                  items: { type: string }

  - name: trip_packing_researcher
    kind: registry.entry
    meta:
      type: agent.gen1
      title: Trip Packing Researcher
      comment: Climate/season-aware packing list
    prompt: |
      You are a travel packing advisor. Given a destination, dates, and inferred season,
      produce a concise, practical packing list grouped by category. Focus on what the climate
      and likely activities require. Your reply MUST match the exit_schema.
    model: claude-4-5-haiku
    temperature: 0.3
    max_tokens: 2000
    arena:
      max_iterations: 3
      exit_schema:
        type: object
        required: [packing]
        additionalProperties: false
        properties:
          packing:
            type: array
            items:
              type: object
              required: [category, items]
              additionalProperties: false
              properties:
                category: { type: string }
                items:
                  type: array
                  items: { type: string }

  - name: trip_itinerary_synthesizer
    kind: registry.entry
    meta:
      type: agent.gen1
      title: Trip Itinerary Synthesizer
      comment: Assigns attractions to days and time slots
    prompt: |
      You plan daily itineraries. Select from the provided attractions list only (do NOT invent
      new ones) and schedule each selection on a specific date within the trip range. Use the
      attraction's `name` value verbatim as `attraction_name` — any paraphrase will be rejected.
      The first date is arrival day (<= 2 items) and the last date is departure day (<= 2 items).
      Prefer morning/afternoon/evening slots. When a critic_feedback is present in your input,
      address each issue in your next output. Your reply MUST match the exit_schema.
    model: claude-4-5-sonnet
    temperature: 0.4
    max_tokens: 4000
    arena:
      max_iterations: 4
      exit_func_id: app.trips:validate_synthesizer_exit
      exit_schema:
        type: object
        required: [itinerary]
        additionalProperties: false
        properties:
          itinerary:
            type: array
            items:
              type: object
              required: [date, attraction_name, time_slot, estimated_duration_hours, description, constraints]
              additionalProperties: false
              properties:
                date: { type: string }
                attraction_name: { type: string }
                time_slot: { type: string, enum: [morning, afternoon, evening] }
                estimated_duration_hours: { type: number }
                description: { type: string }
                constraints:
                  type: array
                  items: { type: string }

  - name: trip_itinerary_critic
    kind: registry.entry
    meta:
      type: agent.gen1
      title: Trip Itinerary Critic
      comment: Reviews itineraries and reports issues
    prompt: |
      You are an experienced travel planner reviewing the itinerary produced by the synthesizer.
      Check for: arrival/departure over-scheduling, pacing (too many long visits in one day),
      geographic thrash (consecutive items on opposite sides of the city), ignored constraints
      (e.g. "closed Mondays"). Emit status="ok" only if the plan is acceptable. Otherwise return
      concrete issues the synthesizer can fix. Your reply MUST match the exit_schema.
    model: claude-4-5-haiku
    temperature: 0.3
    max_tokens: 2000
    arena:
      max_iterations: 3
      exit_schema:
        type: object
        required: [status, issues]
        additionalProperties: false
        properties:
          status: { type: string, enum: [ok, revise] }
          issues:
            type: array
            items: { type: string }
