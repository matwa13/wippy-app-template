version: "1.0"
namespace: app.api.auth

entries:
    - name: login_page
      kind: function.lua
      source: file://login_page.lua
      modules:
          - http
          - security
          - time
      method: handler

    - name: login_page.endpoint
      kind: http.endpoint
      meta:
          router: app:api.public
      method: GET
      func: login_page
      path: /auth/login
