version: "1.0"
namespace: app.tasks

entries:
    # --- Migration ---
    - name: 01_init
      kind: function.lua
      meta:
          type: migration
          target_db: app:db
          description: Create tasks table
          depends_on:
              - ns:wippy.migration
          timestamp: "2026-04-15T00:00:00Z"
      source: file://migrations/01_init.lua
      imports:
          migration: wippy.migration:migration
      method: migrate

    - name: 02_add_fields
      kind: function.lua
      meta:
          type: migration
          target_db: app:db
          description: Add notes, due_date, priority to tasks
          depends_on:
              - ns:wippy.migration
          timestamp: "2026-04-16T00:00:00Z"
      source: file://migrations/02_add_fields.lua
      imports:
          migration: wippy.migration:migration
      method: migrate

    # --- Shared repo ---
    - name: task_repo
      kind: library.lua
      source: file://task_repo.lua
      modules:
          - sql
          - uuid

    - name: tools_common
      kind: library.lua
      source: file://tools_common.lua

    # --- HTTP handlers ---
    - name: list_tasks
      kind: function.lua
      source: file://api/list_tasks.lua
      modules:
          - http
          - security
      imports:
          task_repo: app.tasks:task_repo
      method: handler
      pool:
          size: 2

    - name: list_tasks.endpoint
      kind: http.endpoint
      meta:
          router: app:api
      method: GET
      func: list_tasks
      path: /tasks

    - name: create_task
      kind: function.lua
      source: file://api/create_task.lua
      modules:
          - http
          - json
          - security
      imports:
          task_repo: app.tasks:task_repo
      method: handler
      pool:
          size: 2

    - name: create_task.endpoint
      kind: http.endpoint
      meta:
          router: app:api
      method: POST
      func: create_task
      path: /tasks

    - name: update_task
      kind: function.lua
      source: file://api/update_task.lua
      modules:
          - http
          - json
          - security
      imports:
          task_repo: app.tasks:task_repo
      method: handler
      pool:
          size: 2

    - name: update_task.endpoint
      kind: http.endpoint
      meta:
          router: app:api
      method: PATCH
      func: update_task
      path: /tasks/{id}

    - name: delete_task
      kind: function.lua
      source: file://api/delete_task.lua
      modules:
          - http
          - security
      imports:
          task_repo: app.tasks:task_repo
      method: handler
      pool:
          size: 2

    - name: delete_task.endpoint
      kind: http.endpoint
      meta:
          router: app:api
      method: DELETE
      func: delete_task
      path: /tasks/{id}

    # --- Agent tools ---
    - name: add_task
      kind: function.lua
      meta:
          type: tool
          title: Add Task
          input_schema: |
              {
                "type": "object",
                "properties": {
                  "title":    { "type": "string", "description": "Title of the task to create" },
                  "notes":    { "type": "string", "description": "Optional freeform notes" },
                  "due_date": { "type": "string", "description": "Due date in ISO format e.g. 2026-04-20" },
                  "priority": { "type": "string", "enum": ["low", "medium", "high"], "description": "Task priority, default medium" }
                },
                "required": ["title"],
                "additionalProperties": false
              }
          llm_alias: AddTask
          llm_description: Add a new task to the user's personal task list. Optionally set notes, due_date, and priority.
      source: file://tools/add_task.lua
      modules:
          - ctx
      imports:
          task_repo: app.tasks:task_repo
          tools_common: app.tasks:tools_common
      method: handler
      pool:
          size: 2

    - name: list_tasks_tool
      kind: function.lua
      meta:
          type: tool
          title: List Tasks
          input_schema: |
              {
                "type": "object",
                "properties": {
                  "filter": {
                    "type": "string",
                    "enum": ["all", "open", "done"],
                    "default": "all",
                    "description": "Which tasks to return"
                  }
                },
                "additionalProperties": false
              }
          llm_alias: ListTasks
          llm_description: List the user's personal tasks. Use filter to narrow by status.
      source: file://tools/list_tasks_tool.lua
      modules:
          - ctx
      imports:
          task_repo: app.tasks:task_repo
      method: handler
      pool:
          size: 2

    - name: complete_task
      kind: function.lua
      meta:
          type: tool
          title: Complete Task
          input_schema: |
              {
                "type": "object",
                "properties": {
                  "title": { "type": "string", "description": "Title (or substring) of the task to mark done" },
                  "id":    { "type": "string", "description": "Exact task id (preferred when known)" }
                },
                "additionalProperties": false
              }
          llm_alias: CompleteTask
          llm_description: Mark a task as done. Provide either id or title; title matches exact first, then unique substring among open tasks.
      source: file://tools/complete_task.lua
      modules:
          - ctx
      imports:
          task_repo: app.tasks:task_repo
          tools_common: app.tasks:tools_common
      method: handler
      pool:
          size: 2

    - name: delete_task_tool
      kind: function.lua
      meta:
          type: tool
          title: Delete Task
          input_schema: |
              {
                "type": "object",
                "properties": {
                  "title": { "type": "string", "description": "Title (or substring) of the task to delete" },
                  "id":    { "type": "string", "description": "Exact task id (preferred when known)" }
                },
                "additionalProperties": false
              }
          llm_alias: DeleteTask
          llm_description: Delete a task. Provide either id or title; title matches exact first, then unique substring.
      source: file://tools/delete_task_tool.lua
      modules:
          - ctx
      imports:
          task_repo: app.tasks:task_repo
          tools_common: app.tasks:tools_common
      method: handler
      pool:
          size: 2

    - name: update_task_tool
      kind: function.lua
      meta:
          type: tool
          title: Update Task
          input_schema: |
              {
                "type": "object",
                "properties": {
                  "title":    { "type": "string", "description": "Title (or substring) of the task to update" },
                  "id":       { "type": "string", "description": "Exact task id (preferred when known)" },
                  "notes":    { "type": "string", "description": "Free-text notes to attach (empty string to clear)" },
                  "due_date": { "type": "string", "description": "ISO date e.g. 2026-04-20 (empty string to clear)" },
                  "priority": { "type": "string", "enum": ["low", "medium", "high"], "description": "Task priority" }
                },
                "additionalProperties": false
              }
          llm_alias: UpdateTask
          llm_description: Update notes, due_date, or priority on an existing task. Identify by id or title.
      source: file://tools/update_task_tool.lua
      modules:
          - ctx
      imports:
          task_repo: app.tasks:task_repo
          tools_common: app.tasks:tools_common
      method: handler
      pool:
          size: 2

    # --- Agent trait bundling all task tools ---
    - name: tasks_trait
      kind: registry.entry
      meta:
          type: agent.trait
          title: Task Management
          tags:
              - tasks
      prompt: |
          You also manage the user's personal tasks.
          - AddTask(title, notes?, due_date?, priority?) — create a task. priority is "low", "medium", or "high".
          - ListTasks(filter?) — list tasks; filter one of "all" | "open" | "done".
          - UpdateTask({title or id}, notes?, due_date?, priority?) — update fields on an existing task.
          - CompleteTask({title} or {id}) — mark a task done.
          - DeleteTask({title} or {id}) — delete a task.
          due_date must be a full ISO date with year, e.g. "2026-04-20". When the user says "April 7th" without a year, use the current year — never guess a past year.
          When the user refers to a task by name, pass it as `title` and trust the fuzzy match.
          If the tool returns candidates, ask the user to disambiguate.
          After ListTasks, render results as a markdown checklist:
            `- [ ] **[HIGH]** Buy groceries (due 2026-04-20)` — include priority label only if not medium; include due date if set.
            `- [x] title` for done tasks.
          After mutations, give a one-line confirmation.
      tools:
          - app.tasks:add_task
          - app.tasks:list_tasks_tool
          - app.tasks:update_task_tool
          - app.tasks:complete_task
          - app.tasks:delete_task_tool
