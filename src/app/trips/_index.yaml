version: "1.0"
namespace: app.trips

entries:
  # --- Migrations ---
  - name: 01_init
    kind: function.lua
    meta:
      type: migration
      target_db: app:db
      description: Create trips table
      depends_on:
        - ns:wippy.migration
      timestamp: "2026-04-17T00:00:00Z"
    source: file://migrations/01_init.lua
    imports:
      migration: wippy.migration:migration
    method: migrate

  - name: 02_tasks_fields
    kind: function.lua
    meta:
      type: migration
      target_db: app:db
      description: Add trip_id and scheduled_at to tasks
      depends_on:
        - ns:wippy.migration
        - ns:app.tasks
      timestamp: "2026-04-17T00:00:01Z"
    source: file://migrations/02_tasks_fields.lua
    imports:
      migration: wippy.migration:migration
    method: migrate

  # --- Shared libs ---
  - name: trip_repo
    kind: library.lua
    source: file://trip_repo.lua
    modules:
      - sql
      - uuid
      - json

  - name: trips_common
    kind: library.lua
    source: file://trips_common.lua

  # --- HTTP handlers ---
  - name: list_trips
    kind: function.lua
    source: file://api/list_trips.lua
    modules:
      - http
      - security
    imports:
      trip_repo: app.trips:trip_repo
    method: handler
    pool:
      size: 2

  - name: list_trips.endpoint
    kind: http.endpoint
    meta:
      router: app:api
    method: GET
    func: list_trips
    path: /trips

  - name: create_trip
    kind: function.lua
    source: file://api/create_trip.lua
    modules:
      - http
      - json
      - security
    imports:
      trip_repo: app.trips:trip_repo
      trips_common: app.trips:trips_common
    method: handler
    pool:
      size: 2

  - name: create_trip.endpoint
    kind: http.endpoint
    meta:
      router: app:api
    method: POST
    func: create_trip
    path: /trips

  - name: get_trip
    kind: function.lua
    source: file://api/get_trip.lua
    modules:
      - http
      - security
      - sql
    imports:
      trip_repo: app.trips:trip_repo
    method: handler
    pool:
      size: 2

  - name: get_trip.endpoint
    kind: http.endpoint
    meta:
      router: app:api
    method: GET
    func: get_trip
    path: /trips/{id}

  # --- Tests ---
  - name: trips_test
    kind: function.lua
    meta:
      type: test
      suite: trips
    source: file://trip_repo_test.lua
    method: run
    imports:
      test: wippy.test:test
      trip_repo: app.trips:trip_repo
